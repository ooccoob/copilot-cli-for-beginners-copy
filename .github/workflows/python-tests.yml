name: Python Tests

on:
  push:
    branches: ["main"]
    paths:
      - "samples/book-app-project/**"
  pull_request:
    paths:
      - "samples/book-app-project/**"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: samples/book-app-project

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v
